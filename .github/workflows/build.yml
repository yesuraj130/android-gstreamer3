name: Build GStreamer Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      gst_version:
        description: 'GStreamer Version'
        required: true
        default: '1.28.0'

jobs:
  build:
    name: Build GStreamer 1.28 Dual-ABI APK
    runs-on: ubuntu-latest

    env:
      GST_VERSION: ${{ github.event.inputs.gst_version || '1.28.0' }}
      NDK_VERSION: '25.2.9519653'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK
        run: |
          echo "Installing Android NDK $NDK_VERSION..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Restore GStreamer Android SDK Cache
        id: cache-gstreamer
        uses: actions/cache/restore@v4
        with:
          path: ~/gst-sdk
          key: gst-android-universal-${{ env.GST_VERSION }}-dual-abi

      - name: Install aria2 for high-speed multi-connection download
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Download & Extract GStreamer Android SDK (Multi-stream)
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/gst-sdk
          cd ~/gst-sdk
          ARCHIVE_NAME="gstreamer-1.0-android-universal-${GST_VERSION}.tar.xz"
          PRIMARY_URL="https://gstreamer.freedesktop.org/data/pkg/android/${GST_VERSION}/${ARCHIVE_NAME}"
          FALLBACK_URL="https://gstreamer.freedesktop.org/data/pkg/android/1.24.12/gstreamer-1.0-android-universal-1.24.12.tar.xz"

          echo "Starting multi-connection download (16 streams via aria2c)..."
          if aria2c -x16 -s16 -j16 -k1M --summary-interval=5 --console-log-level=notice --file-allocation=none --max-tries=10 --retry-wait=2 "$PRIMARY_URL" -o "$ARCHIVE_NAME"; then
            echo "Successfully downloaded $PRIMARY_URL with aria2c"
          else
            echo "1.28 primary mirror slow or unavailable, switching to fallback $FALLBACK_URL..."
            aria2c -x16 -s16 -j16 -k1M --summary-interval=5 --console-log-level=notice --file-allocation=none --max-tries=10 --retry-wait=2 "$FALLBACK_URL" -o "$ARCHIVE_NAME"
          fi

          echo "Extracting GStreamer Universal SDK..."
          tar -xf "$ARCHIVE_NAME"

          echo "Cleaning up archive and unused x86/x86_64 binaries to keep cache compact..."
          rm -f "$ARCHIVE_NAME"
          # Keep only armeabi-v7a (armv7) and arm64-v8a (arm64) as requested
          rm -rf gstreamer-1.0-android-universal*/x86 gstreamer-1.0-android-universal*/x86_64 || true
          rm -rf x86 x86_64 || true
          ls -la

      - name: Save GStreamer SDK to Cache Immediately
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/gst-sdk
          key: gst-android-universal-${{ env.GST_VERSION }}-dual-abi

      - name: Set GStreamer Environment Variables
        run: |
          # GStreamer root folder extracted from tarball
          GSTREAMER_ROOT="$HOME/gst-sdk"
          if [ -d "$HOME/gst-sdk/gstreamer-1.0-android-universal" ]; then
            GSTREAMER_ROOT="$HOME/gst-sdk/gstreamer-1.0-android-universal"
          fi
          echo "GSTREAMER_ROOT_ANDROID=$GSTREAMER_ROOT" >> $GITHUB_ENV
          echo "gstAndroidRoot=$GSTREAMER_ROOT" >> gradle.properties
          echo "Using GSTREAMER_ROOT_ANDROID=$GSTREAMER_ROOT"

      - name: Ensure Gradle Wrapper is ready
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew wrapper script missing, generating..."
            gradle wrapper || true
          fi
          chmod +x gradlew

      - name: Decode Debug Keystore for APK Signing
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Build Debug APK with Dual ABI (armeabi-v7a & arm64-v8a)
        run: |
          ./gradlew assembleDebug --stacktrace -PgstAndroidRoot="$GSTREAMER_ROOT_ANDROID"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
